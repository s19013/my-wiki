ServerName my-wiki

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # 言語でレスポンスが違うので（旧サーバーの httpd.conf 末尾から引き継ぎ）
    Header set Vary Accept-Language,Encoding

    # Caddy 経由なので、ログには本当の接続元 IP を出す
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 172.16.0.0/12

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
