; 旧サーバー(Bitnami)の php.ini から引き継いだ値
memory_limit = 256M
upload_max_filesize = 80M
post_max_size = 80M
max_execution_time = 30
date.timezone = UTC

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 10000
; コードはイメージに焼き込むので、ファイル更新のチェックは不要
opcache.validate_timestamps = 0
